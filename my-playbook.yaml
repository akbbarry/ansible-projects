---
- name: Install Docker
  hosts: all
  become: yes

  tasks:
    - name: Install Docker
      yum:
        name: docker
        state: present

    - name: Start docker daemon
      systemd:
        name: docker
        state: started

    - name: Install Python3 and pip
      yum:
        name:
          - python3
          - python3-pip
        state: present

    - name: Install Docker Python SDK
      pip:
        name: docker
        executable: pip3

- name: Install Docker Compose
  hosts: all
  become: yes

  tasks:
    - name: Create Docker Compose plugin directory
      file:
        path: /home/ec2-user/.docker/cli-plugins
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: '0755'

    - name: Get architecture of remote machine
      shell: uname -m
      register: remote_arch

    - name: Install Docker Compose
      get_url:
        url: "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-{{ remote_arch.stdout }}"
        dest: /home/ec2-user/.docker/cli-plugins/docker-compose
        mode: '0755'